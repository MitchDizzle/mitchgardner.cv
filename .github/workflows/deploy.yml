name: Build and Deploy

# Same setup as TheCafeSite: a push to main builds the site (including the
# public resume PDF, printed by headless Chrome) and uploads _site/ by FTP.
on:
  push:
    branches:
      - main

# One deploy at a time; a running upload is never cancelled halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (site and public resume PDF)
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./_site/

      # A mistake in .htaccess takes the whole site down, so look at the live
      # site right after uploading. A red X here means check it now.
      - name: Check the live site
        run: |
          url=$(node -p "require('./src/_data/site.json').url")
          pdf=$(node -p "require('./scripts/variants.js').loadVariants()[0].file")
          fail=0
          expect() {
            got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$2" || true)
            if [ "$got" = "$1" ]; then echo "ok    $got  $2"; else echo "FAIL  $got  $2 (expected $1)"; fail=1; fi
          }
          expect 200 "$url/"
          expect 200 "$url/resume/"
          expect 200 "$url/$pdf.pdf"
          expect 301 "${url/https:\/\//https://www.}/"
          expect 404 "$url/.ftp-deploy-sync-state.json"
          exit $fail
